
services:
  zyra:
    build:
      context: ../candidate
      dockerfile: Dockerfile
    image: zyra-master-hub:production-candidate-v1.0
    environment:
      ZYRA_API_KEY: ${ZYRA_API_KEY}
      ZYRA_DB: /data/zyra.db
    ports:
      - "8080:8080"
    volumes:
      - zyra-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  zyra-data:
